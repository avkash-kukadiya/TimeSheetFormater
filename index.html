<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="timesheet-app-root" class="w-full min-h-[100dvh]"></div>

    <!-- Python In-Browser Smart Parser Logic -->
    <script type="py">
import re
import json

def parse_timesheet_text(raw_text):
    if not raw_text or not raw_text.strip():
        return json.dumps({"date": None, "project": None, "tasks": []})

    lines = [line.strip() for line in raw_text.split('\n') if line.strip()]

    extracted_date = None
    extracted_project = None
    tasks = []

    # Regex patterns for flex matching headers
    date_pattern = re.compile(r'^(?:date|dt|created|day)\s*[:\-=]?\s*(.+)$', re.IGNORECASE)
    project_pattern = re.compile(r'^(?:project(?:\s*name)?|proj|p_name)\s*[:\-=]?\s*(.+)$', re.IGNORECASE)
    header_skip_pattern = re.compile(r'^(?:tasks?|updates?|tasks?\s*updates?|log|work\s*done|status)[:\-=]?$', re.IGNORECASE)

    # Status indicators mapping
    done_terms = {'done', 'completed', 'finish', 'finished', 'complete', 'ok', 'resolved', 'closed', '100%'}
    wip_terms = {'wip', 'in progress', 'working', 'progress', 'doing', 'ongoing', 'started', '50%'}
    todo_terms = {'todo', 'pending', 'to do', 'backlog', 'blocked', 'open', '0%'}

    # Strategy 1: Explicit metadata scan
    unhandled_lines = []
    for line in lines:
        d_match = date_pattern.match(line)
        if d_match and not extracted_date:
            extracted_date = d_match.group(1).strip()
            continue

        p_match = project_pattern.match(line)
        if p_match and not extracted_project:
            extracted_project = p_match.group(1).strip()
            continue

        if header_skip_pattern.match(line):
            continue

        unhandled_lines.append(line)

    # Strategy 2: Implicit Project Name detection (e.g. "CIU Consumer investigation")
    final_task_lines = []
    for idx, line in enumerate(unhandled_lines):
        if idx == 0 and not extracted_project:
            is_task_like = re.search(r'[\(\[\-\:\,\s]+(done|completed|finished|wip|in progress|working|todo|pending)[\)\]\s]*$', line, re.IGNORECASE) or \
                           re.match(r'^\s*[\(\[]?\s*(done|completed|finished|wip|in progress|working|todo|pending)\s*[\)\]\:\-]', line, re.IGNORECASE) or \
                           re.match(r'^(?:task\s*\d*|[\d+\.\-\*\•\>])\s*[:\-]?\s*', line, re.IGNORECASE)

            if not is_task_like and len(line.split()) >= 1 and not re.search(r'\d{1,4}[\/\-\.]\d{1,4}', line):
                extracted_project = line.strip()
                continue

        final_task_lines.append(line)

    # Status Parsing Logic
    for line in final_task_lines:
        status = 'done'
        cleaned_line = line

        # 1. Trailing brackets/parentheses status check like "(wip)", "[done]", "- todo"
        inline_status_match = re.search(r'[\(\[\-\:\,\s]+(done|completed|finished|wip|in progress|working|todo|pending)[\)\]\s]*$', cleaned_line, re.IGNORECASE)
        if inline_status_match:
            term = inline_status_match.group(1).lower()
            if term in done_terms:
                status = 'done'
            elif term in wip_terms:
                status = 'wip'
            elif term in todo_terms:
                status = 'todo'
            cleaned_line = cleaned_line[:inline_status_match.start()].strip()

        # 2. Leading status check like "[WIP] Task text", "DONE: Task text"
        prefix_status_match = re.match(r'^\s*[\(\[]?\s*(done|completed|finished|wip|in progress|working|todo|pending)\s*[\)\]\:\-]\s*(.+)$', cleaned_line, re.IGNORECASE)
        if prefix_status_match:
            term = prefix_status_match.group(1).lower()
            if term in done_terms:
                status = 'done'
            elif term in wip_terms:
                status = 'wip'
            elif term in todo_terms:
                status = 'todo'
            cleaned_line = prefix_status_match.group(2).strip()

        # Clean noise: remove bullets (*, -, •, numbers like 1., Task1:, task2)
        cleaned_line = re.sub(r'^(?:task\s*\d*\s*[:\-]?\s*|[\d+\.\-\*\•\>]\s*)', '', cleaned_line, flags=re.IGNORECASE).strip()

        if cleaned_line:
            tasks.append({
                "text": cleaned_line,
                "status": status
            })

    return json.dumps({
        "date": extracted_date,
        "project": extracted_project,
        "tasks": tasks
    })

# Expose function to JS Window object
from pyodide.ffi import create_proxy
import js
js.window.pythonParseTimesheet = create_proxy(parse_timesheet_text)
    </script>

    <!-- React Application Code -->
    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo, useRef } = React;

      // ---------------------------------------------------------------------
      // IndexedDB Helper Utility
      // ---------------------------------------------------------------------
      const DB_NAME = 'TimesheetAppDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'history';

      const openDB = () => {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          request.onsuccess = (event) => resolve(event.target.result);
          request.onerror = (event) => reject(event.target.error);
        });
      };

      const saveRecordToDB = async (record) => {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.put(record);
          request.onsuccess = () => resolve(request.result);
          request.onerror = (event) => reject(event.target.error);
        });
      };

      const getAllRecordsFromDB = async () => {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = (event) => reject(event.target.error);
        });
      };

      const deleteRecordFromDB = async (id) => {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = (event) => reject(event.target.error);
        });
      };

      const clearAllRecordsFromDB = async () => {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.clear();
          request.onsuccess = () => resolve();
          request.onerror = (event) => reject(event.target.error);
        });
      };

      // ---------------------------------------------------------------------
      // Shared parsing helpers (used by the JS fallback parser)
      // ---------------------------------------------------------------------
      const STATUS_TERM_RE = '(done|completed|finish|finished|wip|in progress|working|todo|pending)';
      const DONE_RE = /(done|completed|finish|finished)$/i;
      const WIP_RE = /(wip|in progress|working)$/i;
      const TODO_RE = /(todo|pending)$/i;

      const classifyStatus = (term) => {
        const t = term.toLowerCase();
        if (DONE_RE.test(t)) return 'done';
        if (WIP_RE.test(t)) return 'wip';
        if (TODO_RE.test(t)) return 'todo';
        return 'done';
      };

      function TimesheetApp() {
        const getCurrentDateString = () => {
          const d = new Date();
          const day = d.getDate();
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          return `${day}-${months[d.getMonth()]}-${d.getFullYear()}`;
        };

        const getCurrentTimeString = () => new Date().toLocaleTimeString();

        const [projectName, setProjectName] = useState('');
        const [customDate, setCustomDate] = useState(getCurrentDateString());
        const [currentTime, setCurrentTime] = useState(getCurrentTimeString());
        const [tasks, setTasks] = useState([]);
        const [inputTask, setInputTask] = useState('');
        const [taskStatus, setTaskStatus] = useState('done');
        const [copied, setCopied] = useState(false);
        const [pastedText, setPastedText] = useState('');
        const [isPythonReady, setIsPythonReady] = useState(false);

        // Saved Timesheet Edit Tracking State
        const [editingRecordId, setEditingRecordId] = useState(null);

        // Task Item Edit Modal State
        const [editingTask, setEditingTask] = useState(null); // null or { id, text, status }

        // Filter & Search tasks in editor
        const [statusFilter, setStatusFilter] = useState('all');

        // Validation & Notification States
        const [errors, setErrors] = useState({});
        const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
        const toastTimerRef = useRef(null);

        // View & All Timesheets States
        const [activeView, setActiveView] = useState('editor'); // 'editor' | 'allTimesheets'
        const [allTimesheets, setAllTimesheets] = useState([]);
        const [timesheetsSearch, setTimesheetsSearch] = useState('');

        const triggerToast = useCallback((message, type = 'info') => {
          if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
          setToast({ show: true, message, type });
          toastTimerRef.current = setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3000);
        }, []);

        const loadAllTimesheets = useCallback(async () => {
          try {
            const records = await getAllRecordsFromDB();
            records.sort((a, b) => b.timestamp - a.timestamp);
            setAllTimesheets(records);
          } catch (err) {
            console.error("Failed to load timesheets from IndexedDB:", err);
          }
        }, []);

        useEffect(() => {
          loadAllTimesheets();

          const timer = setInterval(() => setCurrentTime(getCurrentTimeString()), 1000);

          const checkPyReady = setInterval(() => {
            if (typeof window.pythonParseTimesheet === 'function') {
              setIsPythonReady(true);
              clearInterval(checkPyReady);
            }
          }, 300);

          return () => {
            clearInterval(timer);
            clearInterval(checkPyReady);
            if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
          };
        }, [loadAllTimesheets]);

        // -------------------------------------------------------------------
        // Form Validations
        // -------------------------------------------------------------------
        const validateField = useCallback((field, value) => {
          setErrors(prev => {
            const err = { ...prev };
            if (field === 'date') {
              if (!value || !value.trim()) err.date = 'Date cannot be empty.';
              else delete err.date;
            }
            if (field === 'projectName') {
              if (!value || !value.trim()) err.projectName = 'Project name is required.';
              else delete err.projectName;
            }
            if (field === 'inputTask') {
              if (!value || !value.trim()) err.inputTask = 'Task description cannot be empty.';
              else delete err.inputTask;
            }
            return err;
          });
        }, []);

        const validateForm = useCallback(() => {
          const err = {};
          if (!customDate || !customDate.trim()) err.date = 'Date is required.';
          if (!projectName || !projectName.trim()) err.projectName = 'Project name is required.';
          if (tasks.length === 0) err.tasks = 'At least one task must be added to export or save.';
          setErrors(err);
          return Object.keys(err).length === 0;
        }, [customDate, projectName, tasks]);

        const addTask = useCallback((e) => {
          e.preventDefault();
          if (!inputTask.trim()) {
            setErrors(prev => ({ ...prev, inputTask: 'Task description cannot be empty.' }));
            return;
          }
          setTasks(prev => [...prev, { id: Date.now() + Math.random(), text: inputTask.trim(), status: taskStatus }]);
          setInputTask('');
          setErrors(prev => {
            const newErr = { ...prev };
            delete newErr.inputTask;
            delete newErr.tasks;
            return newErr;
          });
          triggerToast('Task added successfully!', 'success');
        }, [inputTask, taskStatus, triggerToast]);

        const updateTaskText = useCallback((id, newText) => {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, text: newText } : t));
        }, []);

        const updateTaskStatus = useCallback((id, newStatus) => {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));
        }, []);

        const removeTask = useCallback((id) => {
          setTasks(prev => prev.filter(t => t.id !== id));
          triggerToast('Task removed', 'info');
        }, [triggerToast]);

        // Explicit Task Edit Modal Handlers
        const openEditModal = useCallback((task) => {
          setEditingTask({ ...task });
        }, []);

        const saveEditedTask = useCallback(() => {
          if (!editingTask || !editingTask.text.trim()) return;
          setTasks(prev => prev.map(t => t.id === editingTask.id ? editingTask : t));
          setEditingTask(null);
          triggerToast('Task updated!', 'success');
        }, [editingTask, triggerToast]);

        const resetTimesheet = useCallback(() => {
          setCustomDate(getCurrentDateString());
          setProjectName('');
          setTasks([]);
          setInputTask('');
          setTaskStatus('done');
          setPastedText('');
          setEditingRecordId(null);
          setErrors({});
          triggerToast('Timesheet reset successfully.', 'info');
        }, [triggerToast]);

        // -------------------------------------------------------------------
        // Smart Import using Browser-embedded Python engine with JS fallback
        // -------------------------------------------------------------------
        const parseTextToTimesheet = useCallback(() => {
          if (!pastedText.trim()) {
            setErrors(prev => ({ ...prev, pastedText: 'Please enter or paste text to parse.' }));
            return;
          }
          setErrors(prev => {
            const copy = { ...prev };
            delete copy.pastedText;
            return copy;
          });

          let parsedResult = null;

          if (window.pythonParseTimesheet) {
            try {
              const jsonStr = window.pythonParseTimesheet(pastedText);
              parsedResult = JSON.parse(jsonStr);
            } catch (err) {
              console.error("Python parsing error, using JS fallback:", err);
            }
          }

          if (parsedResult) {
            if (parsedResult.date) {
              setCustomDate(parsedResult.date);
              setErrors(prev => { const e = { ...prev }; delete e.date; return e; });
            }
            if (parsedResult.project) {
              setProjectName(parsedResult.project);
              setErrors(prev => { const e = { ...prev }; delete e.projectName; return e; });
            }

            if (parsedResult.tasks && parsedResult.tasks.length > 0) {
              const mappedTasks = parsedResult.tasks.map(t => ({
                id: Date.now() + Math.random(),
                text: t.text,
                status: t.status
              }));
              setTasks(prev => [...prev, ...mappedTasks]);
              setPastedText('');
              setErrors(prev => { const e = { ...prev }; delete e.tasks; return e; });
              triggerToast('Text imported successfully via Python engine!', 'success');
            } else {
              triggerToast('No tasks detected in the pasted text.', 'error');
            }
          } else {
            // JS Fallback
            const lines = pastedText.split('\n').map(l => l.trim()).filter(Boolean);
            const newTasks = [];

            lines.forEach((line, idx) => {
              const dateMatch = line.match(/^Date\s*:\s*(.+)$/i);
              if (dateMatch) {
                setCustomDate(dateMatch[1].trim());
                return;
              }

              const projectMatch = line.match(/^Project(?:\s*Name)?\s*:\s*(.+)$/i);
              if (projectMatch) {
                setProjectName(projectMatch[1].trim());
                return;
              }

              if (idx === 0 && lines.length > 1) {
                const isTaskLike = new RegExp(`^(Task\\s*\\d*|[\\d+\\.\\-\\*\\•\\>])\\s*[:\\-]?\\s*`, 'i').test(line) ||
                                   new RegExp(`[\\-\\:]?\\s*${STATUS_TERM_RE}$`, 'i').test(line);
                if (!isTaskLike) {
                  setProjectName(line.trim());
                  return;
                }
              }

              if (/^Tasks?\s*Updates?:?$/i.test(line)) return;

              let status = 'done';
              let cleanedLine = line;
              const trailingStatusMatch = cleanedLine.match(new RegExp(`[\\-\\:]?\\s*${STATUS_TERM_RE}$`, 'i'));
              if (trailingStatusMatch) {
                status = classifyStatus(trailingStatusMatch[1]);
                cleanedLine = cleanedLine.replace(trailingStatusMatch[0], '');
              }

              cleanedLine = cleanedLine.replace(/^(Task\s*\d*\s*[:\-]?\s*|[\d+\.\-\*\•]\s*)/i, '').trim();

              if (cleanedLine) {
                newTasks.push({
                  id: Date.now() + Math.random(),
                  text: cleanedLine,
                  status: status
                });
              }
            });

            if (newTasks.length > 0) {
              setTasks(prev => [...prev, ...newTasks]);
              setPastedText('');
              setErrors(prev => { const e = { ...prev }; delete e.tasks; return e; });
              triggerToast('Text imported successfully via Fallback JS!', 'success');
            } else {
              triggerToast('No valid tasks extracted from text.', 'error');
            }
          }
        }, [pastedText, triggerToast]);

        const generateTeamsReport = useCallback(() => {
          const taskLines = tasks.map((t, idx) => `Task${idx + 1}: ${t.text} -${t.status}`).join('\n');
          return `Date: ${customDate}
Project Name: ${projectName}
TasksUpdate:
${taskLines}`;
        }, [tasks, customDate, projectName]);

        const reportPreview = useMemo(() => generateTeamsReport(), [generateTeamsReport]);

        const copyToClipboard = useCallback(() => {
          if (!validateForm()) {
            triggerToast('Please correct validation errors before copying.', 'error');
            return;
          }
          const report = generateTeamsReport();
          navigator.clipboard.writeText(report).then(() => {
            setCopied(true);
            triggerToast('Copied Teams report to clipboard!', 'success');
            setTimeout(() => setCopied(false), 2000);
          });
        }, [validateForm, generateTeamsReport, triggerToast]);

        // Save or Update Timesheet in IndexedDB
        const saveOrUpdateTimesheet = useCallback(async (forceNew = false) => {
          if (!validateForm()) {
            triggerToast('Please complete required fields before saving.', 'error');
            return;
          }

          const isUpdating = !forceNew && !!editingRecordId;
          const targetId = isUpdating ? editingRecordId : ('ts_' + Date.now());

          const record = {
            id: targetId,
            timestamp: Date.now(),
            savedAt: new Date().toLocaleString(),
            date: customDate,
            projectName: projectName,
            tasks: tasks,
            formattedReport: generateTeamsReport()
          };

          await saveRecordToDB(record);
          await loadAllTimesheets();
          setEditingRecordId(targetId);

          if (isUpdating) {
            triggerToast('Timesheet updated successfully!', 'success');
          } else {
            triggerToast('Saved timesheet to All Timesheets!', 'success');
          }
          resetTimesheet();
        }, [validateForm, editingRecordId, customDate, projectName, tasks, generateTeamsReport, loadAllTimesheets, triggerToast]);

        const loadTimesheetRecordForEdit = useCallback((record) => {
          setCustomDate(record.date || getCurrentDateString());
          setProjectName(record.projectName || '');
          setTasks(record.tasks || []);
          setEditingRecordId(record.id);
          setActiveView('editor');
          setErrors({});
          triggerToast(`Loaded "${record.projectName || 'Timesheet'}" for editing!`, 'info');
        }, [triggerToast]);

        const deleteTimesheetRecord = useCallback(async (id, e) => {
          e.stopPropagation();
          await deleteRecordFromDB(id);
          await loadAllTimesheets();
          if (editingRecordId === id) {
            setEditingRecordId(null);
          }
          triggerToast('Timesheet record deleted.', 'info');
        }, [loadAllTimesheets, editingRecordId, triggerToast]);

        const clearAllTimesheetsRecords = useCallback(async () => {
          if (window.confirm("Are you sure you want to clear all saved timesheets from IndexedDB?")) {
            await clearAllRecordsFromDB();
            await loadAllTimesheets();
            setEditingRecordId(null);
            triggerToast('All timesheets cleared.', 'info');
          }
        }, [loadAllTimesheets, triggerToast]);

        const filteredTasks = useMemo(() => {
          if (statusFilter === 'all') return tasks;
          return tasks.filter(t => t.status === statusFilter);
        }, [tasks, statusFilter]);

        const filteredTimesheets = useMemo(() => {
          const term = timesheetsSearch.toLowerCase();
          if (!term) return allTimesheets;
          return allTimesheets.filter(item => {
            const matchProj = (item.projectName || '').toLowerCase().includes(term);
            const matchDate = (item.date || '').toLowerCase().includes(term);
            const matchTasks = (item.tasks || []).some(t => t.text.toLowerCase().includes(term));
            return matchProj || matchDate || matchTasks;
          });
        }, [allTimesheets, timesheetsSearch]);

        const badgeStyles = {
          done: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
          wip: 'bg-amber-500/10 text-amber-400 border-amber-500/30',
          todo: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30',
        };

        return (
          <div className="w-full min-h-[100dvh] mx-auto max-w-[1700px] flex flex-col p-3 sm:p-5 lg:p-8">
            <div className="w-full flex-1 flex flex-col bg-slate-900/90 text-slate-100 rounded-2xl shadow-2xl border border-slate-800 font-sans relative overflow-hidden backdrop-blur-xl">

              {/* Toast Notification */}
              {toast.show && (
                <div
                  role="status"
                  className={`toast-anim fixed top-4 left-1/2 -translate-x-1/2 sm:left-auto sm:translate-x-0 sm:right-6 max-w-[92vw] sm:max-w-md px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 text-xs font-semibold border backdrop-blur-md ${
                    toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50' :
                    toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50' :
                    'bg-indigo-950/90 text-indigo-200 border-indigo-500/40 shadow-indigo-950/50'
                  }`}
                >
                  <i className={`fa-solid ${
                    toast.type === 'success' ? 'fa-circle-check text-emerald-400 text-base' :
                    toast.type === 'error' ? 'fa-triangle-exclamation text-rose-400 text-base' :
                    'fa-circle-info text-indigo-400 text-base'
                  }`}></i>
                  <span className="truncate">{toast.message}</span>
                </div>
              )}

              {/* Edit Task Modal */}
              {editingTask && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="glass-panel w-full max-w-lg rounded-2xl p-5 border border-slate-700 shadow-2xl space-y-4 animate-toast-in">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <h3 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i className="fa-solid fa-pen-to-square text-cyan-400"></i> Edit Task Entry
                      </h3>
                      <button 
                        onClick={() => setEditingTask(null)}
                        className="text-slate-400 hover:text-slate-200 text-sm transition-colors"
                      >
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>

                    <div className="space-y-3">
                      <div>
                        <label className="block text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-1">
                          Task Description
                        </label>
                        <textarea
                          rows="3"
                          value={editingTask.text}
                          onChange={(e) => setEditingTask({ ...editingTask, text: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors resize-y"
                        ></textarea>
                      </div>

                      <div>
                        <label className="block text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-1">
                          Status Tag
                        </label>
                        <select
                          value={editingTask.status}
                          onChange={(e) => setEditingTask({ ...editingTask, status: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500"
                        >
                          <option value="done">done</option>
                          <option value="wip">wip</option>
                          <option value="todo">Pending (todo)</option>
                        </select>
                      </div>
                    </div>

                    <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                      <button
                        onClick={() => setEditingTask(null)}
                        className="px-3.5 py-1.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-300 text-xs font-semibold transition-all"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={saveEditedTask}
                        className="px-4 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition-all shadow-lg shadow-cyan-950/50"
                      >
                        Save Changes
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Header */}
              <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 px-4 py-4 sm:px-6 sm:py-5 lg:px-8 border-b border-slate-800 shrink-0 bg-slate-950/40">
                <div className="space-y-1 min-w-0">
                  <div className="flex items-center flex-wrap gap-2.5">
                    <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-emerald-400">
                      <i className="fa-solid fa-bolt mr-2 text-cyan-400"></i>TIMESHEET REPORTER
                    </h1>
                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[11px] font-mono px-2.5 py-0.5 rounded-full flex items-center gap-1.5 shrink-0">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> LIVE
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Real-time dynamic updates, MS Teams report generator, PyScript parser & IndexedDB local storage.</p>
                </div>

                {/* View Tabs */}
                <div className="flex items-center bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto shrink-0 shadow-inner">
                  <button
                    onClick={() => setActiveView('editor')}
                    className={`flex-1 md:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer ${
                      activeView === 'editor' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/50' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <i className="fa-solid fa-pen-to-square"></i> Live Editor
                  </button>
                  <button
                    onClick={() => setActiveView('allTimesheets')}
                    className={`flex-1 md:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer ${
                      activeView === 'allTimesheets' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/50' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <i className="fa-solid fa-clock-rotate-left"></i> All Timesheets ({allTimesheets.length})
                  </button>
                </div>
              </div>

              {/* Scrollable Workspace */}
              <div className="flex-1 overflow-y-auto px-4 py-5 sm:px-6 lg:px-8">

                {/* VIEW 1: EDITOR */}
                {activeView === 'editor' && (
                  <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_420px] xl:grid-cols-[minmax(0,1fr)_460px] gap-6 items-start">

                    {/* Left Column Controls */}
                    <div className="space-y-6 min-w-0">
                      
                      {/* Active Timesheet Edit Indicator Banner */}
                      {editingRecordId && (
                        <div className="flex items-center justify-between bg-amber-950/40 border border-amber-500/40 text-amber-200 px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-md">
                          <div className="flex items-center gap-2 truncate">
                            <i className="fa-solid fa-pen-to-square text-amber-400"></i>
                            <span>Editing Saved Timesheet (<span className="font-mono">{editingRecordId}</span>)</span>
                          </div>
                          <button
                            onClick={() => {setEditingRecordId(null),resetTimesheet()}}
                            className="text-amber-400 hover:text-amber-200 font-bold hover:underline text-xs shrink-0 cursor-pointer ml-2"
                            title="Unlink and save as new timesheet"
                          >
                            <i className="fa-solid fa-xmark mr-1"></i> New Mode
                          </button>
                        </div>
                      )}

                      {/* Top Action Toolbar */}
                      <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-950/50 p-3 rounded-2xl border border-slate-800">
                        <div className="flex items-center gap-2 text-xs font-semibold text-slate-400">
                          <i className="fa-solid fa-sliders text-indigo-400"></i> Actions Bar
                        </div>
                        <div className="flex items-center flex-wrap gap-2 w-full sm:w-auto">
                          {editingRecordId ? (
                            <>
                              <button
                                onClick={() => saveOrUpdateTimesheet(false)}
                                className="flex-1 sm:flex-none bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-3.5 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-md shadow-amber-950/50"
                                title="Update this existing timesheet record"
                              >
                                <i className="fa-solid fa-arrows-rotate"></i> Update Timesheet
                              </button>
                              <button
                                onClick={() => saveOrUpdateTimesheet(true)}
                                className="flex-1 sm:flex-none bg-slate-800 hover:bg-emerald-950/50 text-slate-300 hover:text-emerald-400 border border-slate-700 hover:border-emerald-800/60 font-semibold px-3.5 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-sm"
                                title="Save as a new timesheet record"
                              >
                                <i className="fa-solid fa-plus"></i> Save as New
                              </button>
                            </>
                          ) : (
                            <button
                              onClick={() => saveOrUpdateTimesheet(false)}
                              className="flex-1 sm:flex-none bg-slate-800 hover:bg-emerald-950/50 text-slate-300 hover:text-emerald-400 border border-slate-700 hover:border-emerald-800/60 font-semibold px-3.5 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-sm"
                              title="Save current report to IndexedDB All Timesheets"
                            >
                              <i className="fa-solid fa-floppy-disk"></i> Save Timesheet
                            </button>
                          )}
                          <button
                            onClick={resetTimesheet}
                            className="flex-1 sm:flex-none bg-slate-800 hover:bg-rose-950/40 text-slate-300 hover:text-rose-400 border border-slate-700 hover:border-rose-800/50 font-semibold px-3.5 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-sm"
                            title="Clear all fields"
                          >
                            <i className="fa-solid fa-rotate-left"></i> Reset
                          </button>
                          <button
                            onClick={copyToClipboard}
                            className="flex-1 sm:flex-none bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-md shadow-cyan-950/50 cursor-pointer"
                          >
                            <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                            {copied ? 'Copied!' : 'Copy Teams'}
                          </button>
                        </div>
                      </div>

                      {/* Config & Inputs Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 bg-slate-950/50 p-4 rounded-2xl border border-slate-800">
                        <div>
                          <label className="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">
                            Date <span className="text-rose-400">*</span>
                          </label>
                          <input
                            type="text"
                            value={customDate}
                            onChange={(e) => { setCustomDate(e.target.value); validateField('date', e.target.value); }}
                            className={`w-full bg-slate-900 border ${errors.date ? 'border-rose-500' : 'border-slate-700'} rounded-xl px-3 py-2 text-xs text-cyan-400 font-mono font-bold focus:outline-none focus:border-cyan-500 transition-colors shadow-inner`}
                          />
                          {errors.date && <p className="text-rose-400 text-[10px] mt-1 font-semibold">{errors.date}</p>}
                        </div>

                        <div>
                          <label className="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">
                            Project Name <span className="text-rose-400">*</span>
                          </label>
                          <input
                            type="text"
                            value={projectName}
                            onChange={(e) => { setProjectName(e.target.value); validateField('projectName', e.target.value); }}
                            placeholder="e.g. CIU Consumer investigation"
                            className={`w-full bg-slate-900 border ${errors.projectName ? 'border-rose-500' : 'border-slate-700'} rounded-xl px-3 py-2 text-xs text-indigo-300 font-semibold focus:outline-none focus:border-cyan-500 transition-colors shadow-inner`}
                          />
                          {errors.projectName && <p className="text-rose-400 text-[10px] mt-1 font-semibold">{errors.projectName}</p>}
                        </div>

                        <div className="sm:col-span-2 xl:col-span-1">
                          <label className="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">Live Time</label>
                          <div className="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono flex items-center justify-between shadow-inner">
                            <span className="font-semibold">{currentTime}</span>
                            <i className="fa-regular fa-clock text-slate-500"></i>
                          </div>
                        </div>
                      </div>

                      {/* Smart Parser Card */}
                      <div className="glass-card p-4 rounded-2xl space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                          <label className="text-xs font-bold text-indigo-300 flex items-center gap-2">
                            <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Smart Text Import
                          </label>
                          <span className={`self-start sm:self-auto text-[10px] font-mono px-2.5 py-0.5 rounded-full border ${
                            isPythonReady ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-slate-800 text-slate-500 border-slate-700'
                          }`}>
                            <i className="fa-brands fa-python mr-1"></i>
                            {isPythonReady ? 'PyScript Engine Ready' : 'Loading Engine...'}
                          </span>
                        </div>
                        <textarea
                          rows="3"
                          value={pastedText}
                          onChange={(e) => {
                            setPastedText(e.target.value);
                            if (errors.pastedText) setErrors(prev => { const c = { ...prev }; delete c.pastedText; return c; });
                          }}
                          placeholder="Paste notes or unstructured text here. PyScript automatically formats projects, dates, and tasks..."
                          className={`w-full bg-slate-950 border ${errors.pastedText ? 'border-rose-500' : 'border-slate-700'} rounded-xl p-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono transition-colors resize-y`}
                        ></textarea>
                        {errors.pastedText && <p className="text-rose-400 text-[10px] font-semibold">{errors.pastedText}</p>}
                        <button
                          type="button"
                          onClick={parseTextToTimesheet}
                          className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-indigo-950/50"
                        >
                          <i className="fa-solid fa-arrows-rotate"></i> Parse & Append Text
                        </button>
                      </div>

                      {/* Add Task Form */}
                      <form onSubmit={addTask} className="glass-card p-4 rounded-2xl space-y-3">
                        <label className="block text-xs font-bold text-slate-200">
                          Add Task Item <span className="text-rose-400">*</span>
                        </label>
                        <div className="flex flex-col sm:flex-row gap-2">
                          <input
                            type="text"
                            value={inputTask}
                            onChange={(e) => { setInputTask(e.target.value); validateField('inputTask', e.target.value); }}
                            placeholder="Enter task detail..."
                            className={`flex-1 min-w-0 bg-slate-950 border ${errors.inputTask ? 'border-rose-500' : 'border-slate-700'} rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors`}
                          />
                          <select
                            value={taskStatus}
                            onChange={(e) => setTaskStatus(e.target.value)}
                            className="bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500 shrink-0 font-semibold"
                          >
                            <option value="done">-done</option>
                            <option value="wip">-wip</option>
                            <option value="todo">--Pending</option>
                          </select>
                          <button
                            type="submit"
                            className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-all cursor-pointer shadow-md shadow-cyan-950/50 shrink-0 flex items-center justify-center gap-1.5"
                          >
                            <i className="fa-solid fa-plus"></i> Add Entry
                          </button>
                        </div>
                        {errors.inputTask && <p className="text-rose-400 text-[10px] font-semibold">{errors.inputTask}</p>}
                      </form>

                      {/* Task Errors */}
                      {errors.tasks && (
                        <div className="bg-rose-950/60 border border-rose-800/80 text-rose-300 p-3 rounded-xl text-xs flex items-center gap-2 font-semibold">
                          <i className="fa-solid fa-circle-exclamation text-rose-400"></i>
                          <span>{errors.tasks}</span>
                        </div>
                      )}

                      {/* Interactive Task List */}
                      <div className="space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-2">
                          <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                            <i className="fa-solid fa-list-check text-cyan-400"></i> Task Items ({tasks.length})
                          </h2>

                          {/* Filter Tabs */}
                          <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-[10px]">
                            {['all', 'done', 'wip', 'todo'].map((st) => (
                              <button
                                key={st}
                                onClick={() => setStatusFilter(st)}
                                className={`px-2 py-0.5 rounded capitalize font-semibold transition-colors ${
                                  statusFilter === st ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* List */}
                        <div className="space-y-2 max-h-[440px] overflow-y-auto pr-1">
                          {filteredTasks.length === 0 ? (
                            <div className="text-center py-10 text-slate-500 text-xs bg-slate-950/40 rounded-2xl border border-slate-800/80">
                              <i className="fa-regular fa-folder-open text-2xl mb-2 block text-slate-600"></i>
                              No tasks matched. Type a task above or paste text to parse.
                            </div>
                          ) : (
                            filteredTasks.map((t) => (
                              <div
                                key={t.id}
                                className="group flex flex-col sm:flex-row items-stretch sm:items-center justify-between p-3 rounded-xl bg-slate-950/60 border border-slate-800/80 hover:border-slate-700 text-xs gap-3 transition-all shadow-sm"
                              >
                                <div className="flex items-center gap-2.5 flex-1 min-w-0">
                                  <span className="font-mono text-cyan-400 font-bold shrink-0">
                                    Task{tasks.indexOf(t) + 1}:
                                  </span>
                                  <input
                                    type="text"
                                    value={t.text}
                                    onChange={(e) => updateTaskText(t.id, e.target.value)}
                                    className="w-full bg-transparent border-b border-transparent hover:border-slate-700 focus:border-cyan-500 font-mono text-slate-200 px-1 py-0.5 focus:outline-none transition-colors"
                                  />
                                </div>

                                <div className="flex items-center justify-between sm:justify-end gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800/80">
                                  <select
                                    value={t.status}
                                    onChange={(e) => updateTaskStatus(t.id, e.target.value)}
                                    className={`text-[11px] px-2.5 py-1 rounded-lg border font-bold font-mono focus:outline-none cursor-pointer ${badgeStyles[t.status] || badgeStyles.todo}`}
                                  >
                                    <option value="done">done</option>
                                    <option value="wip">wip</option>
                                    <option value="todo">Pending</option>
                                  </select>

                                  <div className="flex items-center gap-1">
                                    {/* Dedicated Task Edit Button */}
                                    <button
                                      onClick={() => openEditModal(t)}
                                      className="text-slate-400 hover:text-cyan-400 p-1.5 transition-colors cursor-pointer rounded-lg hover:bg-slate-800"
                                      title="Edit Task Details"
                                    >
                                      <i className="fa-solid fa-pen text-xs"></i>
                                    </button>

                                    <button
                                      onClick={() => removeTask(t.id)}
                                      className="text-slate-400 hover:text-rose-400 p-1.5 transition-colors cursor-pointer rounded-lg hover:bg-slate-800"
                                      title="Delete Task"
                                    >
                                      <i className="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                  </div>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>

                    </div>

                    {/* Right Column Preview */}
                    <div className="lg:sticky lg:top-6">
                      <div className="glass-panel p-5 rounded-2xl border border-slate-800 relative shadow-2xl">
                        <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                          <span className="text-xs uppercase font-extrabold tracking-wider text-cyan-400 flex items-center gap-2">
                            <i className="fa-brands fa-microsoft text-indigo-400"></i> MS Teams Output Preview
                          </span>
                          <span className="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live Sync
                          </span>
                        </div>
                        <pre className="text-xs font-mono text-slate-200 whitespace-pre-wrap break-words bg-slate-950/90 p-4 rounded-xl border border-slate-800 leading-relaxed overflow-x-auto select-all max-h-[360px] lg:max-h-[calc(100dvh-280px)] overflow-y-auto shadow-inner">
{reportPreview}
                        </pre>
                        <button
                          onClick={copyToClipboard}
                          className="mt-4 w-full bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-extrabold px-4 py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-cyan-950/50 cursor-pointer"
                        >
                          <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                          {copied ? 'Copied Teams Format!' : 'Copy Teams Format'}
                        </button>
                      </div>
                    </div>

                  </div>
                )}

                {/* VIEW 2: ALL TIMESHEETS */}
                {activeView === 'allTimesheets' && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                      <div className="relative w-full sm:w-2/3">
                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input
                          type="text"
                          placeholder="Search all timesheets by project, date, or task contents..."
                          value={timesheetsSearch}
                          onChange={(e) => setTimesheetsSearch(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      {allTimesheets.length > 0 && (
                        <button
                          onClick={clearAllTimesheetsRecords}
                          className="w-full sm:w-auto bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer"
                        >
                          <i className="fa-solid fa-trash-can"></i> Clear All Timesheets
                        </button>
                      )}
                    </div>

                    {filteredTimesheets.length === 0 ? (
                      <div className="text-center py-16 text-slate-500 text-xs bg-slate-950/40 rounded-2xl border border-slate-800">
                        <i className="fa-solid fa-database text-3xl mb-3 block text-slate-600"></i>
                        No saved timesheet records found in IndexedDB.
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        {filteredTimesheets.map((item) => (
                          <div
                            key={item.id}
                            className={`glass-card hover:border-slate-700 p-4 rounded-2xl transition-all group flex flex-col justify-between space-y-3 ${
                              editingRecordId === item.id ? 'ring-2 ring-cyan-500/80 border-cyan-500/50' : ''
                            }`}
                          >
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-2">
                              <div className="flex items-center flex-wrap gap-2 min-w-0">
                                <span className="text-xs font-bold text-indigo-300 truncate">
                                  {item.projectName || 'Unlabeled Project'}
                                </span>
                                <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded-md border border-cyan-800/40 shrink-0 font-bold">
                                  {item.date}
                                </span>
                              </div>
                              <div className="flex items-center justify-between sm:justify-end gap-2 shrink-0">
                                <span className="text-[10px] text-slate-500 font-mono">{item.savedAt}</span>
                                
                                {/* Edit & Delete Buttons */}
                                <div className="flex items-center gap-1">
                                  <button
                                    onClick={() => loadTimesheetRecordForEdit(item)}
                                    className="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 font-bold px-2 py-1 rounded-lg text-[10px] transition-all flex items-center gap-1 cursor-pointer"
                                    title="Edit and Update this Timesheet"
                                  >
                                    <i className="fa-solid fa-pen-to-square text-[10px]"></i> Edit
                                  </button>
                                  <button
                                    onClick={(e) => deleteTimesheetRecord(item.id, e)}
                                    className="text-slate-500 hover:text-rose-400 p-1.5 transition-colors rounded-lg hover:bg-slate-800"
                                    title="Delete timesheet"
                                  >
                                    <i className="fa-solid fa-trash-can text-xs"></i>
                                  </button>
                                </div>
                              </div>
                            </div>

                            <pre className="text-[11px] font-mono text-slate-300 bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 whitespace-pre-wrap break-words leading-relaxed overflow-x-auto flex-1">
{item.formattedReport}
                            </pre>

                            <button
                              onClick={() => loadTimesheetRecordForEdit(item)}
                              className="pt-1 text-[11px] text-cyan-400 font-bold group-hover:translate-x-1 transition-transform flex items-center gap-1.5 cursor-pointer self-start"
                            >
                              Edit & Update Timesheet <i className="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<TimesheetApp />, document.getElementById('timesheet-app-root'));
    </script>
</body>
</html>
